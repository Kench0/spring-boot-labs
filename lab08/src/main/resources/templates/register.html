<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><link rel="stylesheet" href="/style.css"><title>Учебный портал</title></head><body><nav><b>УрФУ · Учебный портал</b><a href="/">Главная</a><a href="/register">Регистрация</a><a href="/login">Вход</a></nav><main><p class="eyebrow">Лабораторная работа 8 · Spring Security</p><h1>Регистрация</h1><p class="success" th:if="${param.success}">Пользователь успешно зарегистрирован</p><form th:action="@{/register/save}" th:object="${user}" method="post"><label>Имя<input th:field="*{firstName}" type="text" required></label><p class="error" th:errors="*{firstName}"></p><label>Фамилия<input th:field="*{lastName}" type="text" required></label><p class="error" th:errors="*{lastName}"></p><label>Email<input th:field="*{email}" type="email" required></label><p class="error" th:errors="*{email}"></p><label>Пароль — минимум 8 символов<input th:field="*{password}" type="password" required></label><p class="error" th:errors="*{password}"></p><button>Зарегистрироваться</button></form></main></body></html>
