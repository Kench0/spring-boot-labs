<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><link rel="stylesheet" href="/style.css"><title>Учебный портал</title></head><body><nav><b>УрФУ · Учебный портал</b><a href="/list">Студенты</a><a href="/groups">Группы</a><a href="/users">Пользователи</a><form th:action="@{/logout}" method="post"><button>Выйти</button></form></nav><main><p class="eyebrow">Лабораторная работа 8 · К. А. Скуратов</p><h1>Студенты</h1><a class="button" href="/addStudentForm">Добавить</a><table><thead><tr><th>ID</th><th>Имя</th><th>Фамилия</th><th>Факультет</th><th>Возраст</th><th>Действия</th></tr></thead><tbody><tr th:each="item : ${items}"><td th:text="${item.id}"></td><td th:text="${item.name}"></td><td th:text="${item.surname}"></td><td th:text="${item.faculty}"></td><td th:text="${item.age}"></td><td><a th:href="@{/showUpdateForm(studentId=${item.id})}">Изменить</a> <form th:action="@{/deleteStudent}" method="post"><input type="hidden" name="studentId" th:value="${item.id}"><button class="danger">Удалить</button></form></td></tr></tbody></table></main></body></html>
