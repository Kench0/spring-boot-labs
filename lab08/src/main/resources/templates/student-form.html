<!DOCTYPE html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><link rel="stylesheet" href="/style.css"><title>Учебный портал</title></head><body><nav><b>УрФУ · Учебный портал</b><a href="/list">Студенты</a><a href="/groups">Группы</a><a href="/users">Пользователи</a><form th:action="@{/logout}" method="post"><button>Выйти</button></form></nav><main><p class="eyebrow">Лабораторная работа 8 · К. А. Скуратов</p><h1>Студенты — форма</h1><form th:action="@{/saveStudent}" th:object="${item}" method="post"><input type="hidden" th:field="*{id}"><label>Имя<input th:field="*{name}" required></label><p class="error" th:errors="*{name}"></p><label>Фамилия<input th:field="*{surname}" required></label><p class="error" th:errors="*{surname}"></p><label>Факультет<input th:field="*{faculty}" required></label><p class="error" th:errors="*{faculty}"></p><label>Возраст<input th:field="*{age}" required></label><p class="error" th:errors="*{age}"></p><button>Сохранить</button> <a href="/list">Вернуться к списку</a></form></main></body></html>
